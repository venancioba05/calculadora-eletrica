<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#004080">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Elétrica - NBR 5410</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Calculadora Elétrica - Divisão por Cômodos e TUEs</h2>
        
        <div class="form-group">
            <label for="tipoRede">Padrão de Entrada / Tensão (Bahia):</label>
            <select id="tipoRede">
                <option value="mono220">Monofásico - 220 V (F+N)</option>
                <option value="bi220">Bifásico - 220 V (F+F)</option>
                <option value="bi380">Bifásico - 380 V (F+F)</option>
                <option value="tri380" selected>Trifásico - 380 V / 220 V</option>
                <option value="mono127">Monofásico - 127 V (F+N)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fatorDemanda">Fator de Demanda Geral (0.1 a 1.0):</label>
            <input type="number" id="fatorDemanda" value="0.70" step="0.05" min="0.1" max="1.0">
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <h3>Cômodos e Áreas da Instalação</h3>
        <div id="listaComodos">
            <!-- Inserido dinamicamente via JS -->
        </div>

        <button onclick="adicionarComodo()" style="background-color: #28a745; margin-bottom: 15px;">
            + Adicionar Cômodo / Ambiente
        </button>

        <button onclick="calcularQuadroCompleto()">Calcular Projeto Completo</button>

        <div id="resultadoBox" class="result">
            <h3>Relatório Geral do Projeto:</h3>
            <div id="textoResultado"></div>
            <button id="btnCopiar" onclick="copiarRelatorio()" style="background-color: #25D366; margin-top: 15px;">
                Copiar Relatório Completo para WhatsApp
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registado com sucesso!', reg))
        .catch(err => console.log('Erro ao registar Service Worker:', err));
    });
  }
</script>

</body>
</html>
